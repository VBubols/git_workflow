global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Métricas da API (endpoint /metrics), acessada pelo nome do serviço no compose.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']

  # Métricas do PostgreSQL, expostas pelo postgres-exporter.
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  # O próprio Prometheus, útil para conferir se a coleta está funcionando.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
